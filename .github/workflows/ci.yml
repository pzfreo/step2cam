name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rust/fetch-camlib.sh
      - run: cargo test --release --workspace
        working-directory: rust
      - name: The frozen fixtures are what specify-core writes
        run: tests/specify-link.sh
