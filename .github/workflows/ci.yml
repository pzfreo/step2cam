name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    # Tests and the native example need no link-time optimisation: the release
    # profile's thin LTO and single codegen unit are for the shipped WebAssembly,
    # which the site job builds unchanged. Here they made every test binary a
    # whole-program optimised link.
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - name: The benchmark's own tests
        run: python3 -I -m unittest
        working-directory: tools/benchmark
      - run: rust/fetch-camlib.sh
      - name: The toolchain rust/rust-toolchain.toml pins
        run: rustup toolchain install --no-self-update
        working-directory: rust
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: rust
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --release --workspace
        working-directory: rust
      - name: The frozen fixtures are what specify-core writes
        run: tests/specify-link.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - name: The setup sheet's content
        run: node tests/report.mjs
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The WebAssembly site builds, as Pages builds it
        uses: ./.github/actions/build-site
