[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "step2cam"
version = "0.1.0"
description = "STEP part features (specify-core / quiddity) to camlib toolpaths, by pipe"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
step2cam = "step2cam:main"

[tool.setuptools]
py-modules = ["step2cam"]
