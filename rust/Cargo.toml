[package]
name = "step2cam"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "STEP part features (specify-core) to camlib toolpaths, for the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fetched by fetch-camlib.sh: camlib is not published.
camlib = { path = "../vendor/camlib" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
jsonschema = { version = "0.60", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace]
members = ["capp"]
